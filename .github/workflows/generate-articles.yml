name: Generate magazine articles

on:
  push:
    branches:
      - main
    paths:
      - 'מאמרים/**'
      - 'scripts/generate_articles.py'
      - '.github/workflows/generate-articles.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-magazine-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate article pages
        run: python scripts/generate_articles.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add magazine-articles/ sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Generate magazine article pages"

          git pull --rebase origin main
          git push origin HEAD:main
